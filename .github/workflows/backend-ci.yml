name: Backend CI

on:
    pull_request:
        branches:
            - main

    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    test:
        name: Build and test .NET services
        runs-on: ubuntu-latest

        timeout-minutes: 10

        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              
            - name: Set up .NET information
              uses: actions/setup-dotnet@v6
              with:
                    dotnet-version: "10.0.x"

            - name: Display .NET information
              run: dotnet --info

            - name: Restore dependencies
              run: dotnet restore UptimeMonitoring.slnx

            - name: Build solution
              run: >
                dotnet build UptimeMonitoring.slnx
                --configuration Release
                --no-restore

            - name: Run tests
              run: >
                dotnet test UptimeMonitoring.slnx
                --configuration Release
                --no-build
                --logger "trx;LogFileName=test_results.trx"
                --results-directory TestResults

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                name: backend-test-results
                path: TestResults/
                if-no-files-found: warn
                retention-days: 14